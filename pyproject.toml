[project]
name = "offline-knowledge-mcp"
version = "0.1.1"
description = "Local, provenance-aware Wikipedia and statistical retrieval over MCP"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "libzim==4.0.0"]

[project.scripts]
knowledge-mcp = "knowledge_mcp.server:main"
knowledge-import = "knowledge_mcp.ingest:main"
knowledge-verify = "knowledge_mcp.verify:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["knowledge_mcp*"]

[tool.setuptools.package-data]
knowledge_mcp = ["collection_manifest.json"]
